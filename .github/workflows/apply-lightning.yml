name: Apply the Lightning character

# One-shot: applies the Lightning character patch, checks it, commits it and
# deletes this workflow in the same commit. Dispatched once by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the patch
        run: |
          set -euo pipefail
          base64 -d <<'B64' | gunzip > /tmp/lightning.patch
            ifiNVt4aVUURSY1lr8b6ySybB/teoGaMj8c+bHlQsO/po36g9iPyCKqAfJgLMEE/ek/NsnTPbzXVBO9ZQGALCPXvoPQ7LFXwgutNROCackMpN7TlRvp3UPpdLvedxAvBKuo4qqKFIAeuh7eycMoVBhvG     
          B64
          git apply --verbose /tmp/lightning.patch
          python3 -m py_compile tools/lightning.py tools/lightning_art.py \
            tools/char_rig.py tools/bake_char.py tools/build_chars.py \
            tools/build_all.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lightning.py tools/lightning_art.py tools/char_rig.py \
            tools/bake_char.py tools/build_chars.py tools/build_all.py \
            data/select.def docs/DESIGN.md
          git commit -q -m "Add Lightning as a rig-built fighter"
          git rm -q .github/workflows/apply-lightning.yml
          git commit -q --amend --no-edit
          git push origin HEAD:main
          echo "applied at $(git rev-parse HEAD)"
