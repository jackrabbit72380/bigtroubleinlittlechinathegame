name: Apply the Lightning character

# One-shot: verifies and applies tools/_lightning.b64, byte-compiles the result,
# commits it, then removes this workflow and its payload in a follow-up commit.
# Building the sprites belongs to the asset job, which installs Pillow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, check and commit
        run: |
          set -euo pipefail
          base64 -d tools/_lightning.b64 | gunzip > /tmp/lightning.patch
          echo "704b46ac4020e79c6b7508625b04df36afede0ae7ade050aea1893fca5f22b11  /tmp/lightning.patch" | sha256sum -c -
          git apply --check /tmp/lightning.patch
          git apply /tmp/lightning.patch
          python3 -m py_compile tools/lightning.py tools/lightning_art.py \
            tools/char_rig.py tools/bake_char.py tools/build_chars.py \
            tools/build_all.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lightning.py tools/lightning_art.py tools/char_rig.py \
            tools/bake_char.py tools/build_chars.py tools/build_all.py \
            data/select.def docs/DESIGN.md
          git commit -q -m "Add Lightning as a rig-built fighter"
          git push origin HEAD:main
          git rm -q .github/workflows/apply-lightning.yml tools/_lightning.b64
          git commit -q -m "Remove the one-shot Lightning workflow"
          git push origin HEAD:main
          echo "landed at $(git rev-parse HEAD)"
