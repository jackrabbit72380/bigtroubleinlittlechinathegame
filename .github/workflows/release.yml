# Build downloadable game bundles
#
# Each release asset is the official Ikemen GO build for one platform with this
# repository's game files copied over it, so players only download and unzip —
# no separate engine download and no setup.
#
# Ikemen GO is MIT licensed; these bundles redistribute an unmodified engine
# build and keep its LICENCE.txt inside the archive.

name: Build release bundles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            asset: Ikemen_GO-dev-windows.zip
            folder: BigTroubleInLittleChina-Windows
          - platform: Linux
            asset: Ikemen_GO-dev-linux.zip
            folder: BigTroubleInLittleChina-Linux
          - platform: macOS
            asset: Ikemen_GO-dev-macos.zip
            folder: BigTroubleInLittleChina-macOS
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the engine build
        run: |
          set -euo pipefail
          mkdir -p dl stage
          curl -fL --retry 3 -o dl/engine.zip \
            "https://github.com/ikemen-engine/Ikemen-GO/releases/download/nightly/${{ matrix.asset }}"
          unzip -q dl/engine.zip -d stage
          # Some platform archives ship without the engine licence; ship it ourselves so
          # redistribution always carries the MIT notice.
          curl -fL --retry 3 -o dl/LICENCE.txt \
            https://raw.githubusercontent.com/ikemen-engine/Ikemen-GO/develop/LICENCE.txt

      - name: Assemble ${{ matrix.platform }} bundle
        run: |
          set -euo pipefail
          root=$(dirname "$(find stage -maxdepth 3 -type d -name data | head -1)")
          test -d "$root" || { echo "no engine data/ in the archive"; find stage -maxdepth 2; exit 1; }
          out="out/${{ matrix.folder }}"
          mkdir -p "$out"
          cp -rT "$root" "$out"

          # the game's files win over the engine defaults
          for d in data chars stages font external sound; do
            if [ -d "$d" ]; then cp -rT "$d" "$out/$d"; fi
          done


          # The stage-art dumper ships with the game so it can be used from the
          # installed folder: double-click "Dump Stage Art.bat" and the stage
          # sprites are unpacked next to the game as PNGs.
          if [ -f "Dump Stage Art.bat" ]; then cp "Dump Stage Art.bat" "$out"; fi

          mkdir -p "$out/tools"
          cp tools/dump_stage_art.py tools/sff.py "$out/tools/"

          # The binary carries the game's name, not the engine's. On macOS only
          # the .app folder is renamed: the Mach-O inside it has to keep the name
          # Info.plist's CFBundleExecutable points at, or the bundle won't launch.
          case "${{ matrix.platform }}" in
            Windows)
              for f in "$out"/Ikemen_GO*.exe; do
                if [ -e "$f" ]; then mv "$f" "$out/BigTroubleInLittleChinaTheGame.exe"; fi
              done
              ;;
            macOS)
              for d in "$out"/*.app; do
                if [ -d "$d" ]; then mv "$d" "$out/BigTroubleInLittleChinaTheGame.app"; fi
              done
              app="$out/BigTroubleInLittleChinaTheGame.app"
              # the name Finder and the menu bar show comes from CFBundleName
              if [ -f "$app/Contents/Info.plist" ]; then
                sed -i.bak -e 's|<string>I\.K\.E\.M\.E\.N-Go</string>|<string>Big Trouble in Little China</string>|g' \
                  "$app/Contents/Info.plist"
                rm -f "$app/Contents/Info.plist.bak"
              fi
              # the .command launcher hard-codes the .app's name, so it has to be
              # rewritten as well or double-clicking it finds nothing to start
              for f in "$out"/Ikemen_GO*.command; do
                if [ -f "$f" ]; then
                  sed -i.bak -e 's|I\.K\.E\.M\.E\.N-Go\.app|BigTroubleInLittleChinaTheGame.app|g' \
                    -e 's|Ikemen_GO_|BigTroubleInLittleChinaTheGame_|g' "$f"
                  rm -f "$f.bak"
                  mv "$f" "$out/BigTroubleInLittleChinaTheGame.command"
                fi
              done
              ;;
            Linux)
              for f in "$out"/Ikemen_GO*; do
                if [ -f "$f" ]; then mv "$f" "$out/BigTroubleInLittleChinaTheGame"; fi
              done
              ;;
          esac
          mkdir -p "$out/docs"
          cp README.md "$out/README.md"
          cp docs/DESIGN.md "$out/docs/DESIGN.md"

          # Windows Defender labels the engine Trojan:Win32/Tecabans.A!cl on a
          # fresh download. It is a false alarm on an unsigned binary, and the
          # engine's own maintainers say so (ikemen-engine/Ikemen-GO issue 2811).
          # A player who meets that warning before any explanation concludes the
          # download is malware, so the explanation travels inside the zip, beside
          # the hash of the exact binary in this build, and beside the one-click
          # exclusion script.
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            bundled=$(find "$out" -maxdepth 1 -type f -name 'BigTroubleInLittleChinaTheGame.exe' | head -1)
            bundled_hash=$(sha256sum "$bundled" | cut -d' ' -f1)
            {
              printf 'Big Trouble in Little China: The Game\n'
              printf '=====================================\n\n'
              printf 'READ THIS BEFORE YOU DOUBLE-CLICK ANYTHING\n\n'
              printf 'Windows Defender may report the game file\n\n'
              printf '    BigTroubleInLittleChinaTheGame.exe\n\n'
              printf 'as "Trojan:Win32/Tecabans.A!cl". That is a false alarm, not a virus.\n\n'
              printf 'Why it happens: the engine is a free open-source build with no code\n'
              printf 'signing certificate, so Windows has no publisher to check and no\n'
              printf 'history for the file. Its cloud checker reacts to that, and the "!cl"\n'
              printf 'at the end of the name means "cloud verdict", not "known virus".\n'
              printf 'The people who make the engine answered this exact report:\n'
              printf 'https://github.com/ikemen-engine/Ikemen-GO/issues/2811\n\n'
              printf 'Check it instead of trusting it. The SHA-256 of the game file in\n'
              printf 'this zip is:\n\n'
              printf '    %s\n\n' "$bundled_hash"
              printf 'In Windows Explorer, right-click the exe, Properties, Digital\n'
              printf 'signatures: it has none, because the engine ships unsigned. That is\n'
              printf 'the whole reason for the warning.\n\n'
              printf 'If Defender already removed the file:\n'
              printf '  1. Windows Security > Virus and threat protection > Protection history\n'
              printf '  2. The Trojan:Win32/Tecabans.A!cl entry > Actions > Restore\n'
              printf '  3. Double-click ALLOW-THROUGH-DEFENDER.bat in this folder (it asks for\n'
              printf '     administrator rights once)\n'
              printf '  4. Start the game again\n\n'
              printf 'ALLOW-THROUGH-DEFENDER.bat adds this game folder to Defender exclusions and\n'
              printf 'prints whether each path really was added. It changes nothing else.\n\n'
              printf 'The same hash is published with every release as SHA256SUMS.txt.\n'
            } > "$out/READ-ME-FIRST.txt"
            test -s "$out/READ-ME-FIRST.txt" || { echo "READ-ME-FIRST.txt was not written"; exit 1; }
            test -s ALLOW-THROUGH-DEFENDER.bat || { echo "ALLOW-THROUGH-DEFENDER.bat is missing from the repo"; exit 1; }
            cp ALLOW-THROUGH-DEFENDER.bat "$out/ALLOW-THROUGH-DEFENDER.bat"

            # The README sends players to these for online play and for checking
            # which build they are on, so they travel with the game.
            cp "Update and Play.bat" "$out/Update and Play.bat"
          fi
          if [ ! -f "$out/LICENCE.txt" ]; then cp dl/LICENCE.txt "$out/LICENCE.txt"; fi
          # Render resolution is a CONFIG value, not an option-menu item: Ikemen
          # draws at Video.GameWidth x GameHeight and shows that in a window of
          # Video.WindowWidth x WindowHeight, and Options > Video > Resolution
          # only ever changes the window. Every sprite here is painted for a
          # 1920x1080 canvas, so pin the render size to that - one art pixel to
          # one render pixel - and let the window go to 2K or 4K on top of it.
          # Raising GameWidth past 1920 could not add detail; it would only
          # upscale the same art and cost frames.
          # (printf, not a heredoc: a heredoc body at column 0 would end the
          # YAML block scalar this step is written as, and the whole workflow
          # fails to parse before it ever runs.)
          # The file is tracked at the repo root as config.ini, not printed
          # here. It used to be a printf in this step, which is why every
          # bundle shipped a config with no RenderMode key at all: the engine's
          # own seed file only names a window size, so the renderer fell through
          # to the engine default and the player's choice lived only in
          # save/config.ini - unreachable once Vulkan aborts at boot with
          # "device lost", because the menus never appear.
          cp config.ini "$out/config.ini"
          test -s "$out/config.ini" || { echo "config.ini was not written"; exit 1; }

          # The engine opens save/config.ini and nothing else (src/main.go, the
          # day the config path was fixed: configPath := "save/config.ini"). A
          # config.ini at the root is only read when launched as
          # "-config config.ini", so the copy that actually decides the renderer
          # has to live in save/, and it has to exist before the first launch or
          # the game starts on the engine default with no way back once a
          # renderer fails.
          mkdir -p "$out/save"
          cp config.ini "$out/save/config.ini"
          test -s "$out/save/config.ini" || { echo "save/config.ini was not written"; exit 1; }

          # A stamp in the game folder, so a stale extracted copy is obvious.
          printf 'Big Trouble in Little China: The Game\nversion: %s\ncommit: %s\nbuilt: %s\n' \
            "${{ github.event.inputs.tag || github.ref_name }}" \
            "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out/VERSION.txt"

      - name: Verify the bundle is playable
        run: |
          set -euo pipefail
          out="out/${{ matrix.folder }}"
          ours="lopans_throne wingkong_exchange chinatown_alley porkchop_express the_upside_down"
          exe=$(find "$out" -maxdepth 1 \
            \( -name 'BigTroubleInLittleChinaTheGame.exe' \
               -o -name 'BigTroubleInLittleChinaTheGame' \
               -o -name 'BigTroubleInLittleChinaTheGame.app' \) | head -1)
          echo "engine: ${exe:-MISSING}"
          test -n "$exe" || { echo "the engine was not renamed to the game's name"; exit 1; }
          old=$(find "$out" -maxdepth 1 -name 'Ikemen_GO*' | head -1)
          if [ -n "$old" ]; then echo "engine still shipped as $old"; exit 1; fi
          grep -q '^jackburton' "$out/data/select.def" \
            || { echo "the roster in data/select.def is not ours"; exit 1; }
          # Jack must be the project's own rig, not the base character wearing his
          # palette: selecting the wrong folder is exactly how a release quietly
          # ships Kung Fu Man instead of Jack.
          grep -qE '^jackburton_rig/jackburton\.def' "$out/data/select.def" \
            || { echo "select.def does not select the rigged Jack Burton"; exit 1; }
          # the render size pinned in config.ini is what makes 2K/4K windows
          # clean upscales instead of asking the engine to redraw at 4K
          grep -qiE '^GameWidth[[:space:]]*=[[:space:]]*1920' "$out/config.ini" \
            || { echo "config.ini does not pin GameWidth to 1920"; exit 1; }
          grep -qiE '^GameHeight[[:space:]]*=[[:space:]]*1080' "$out/config.ini" \
            || { echo "config.ini does not pin GameHeight to 1080"; exit 1; }
          for f in jackburton.def jackburton.air jackburton.cns jackburton.sff \
                   jackburton.snd jackburton.cmd movelist.dat; do
            test -f "$out/chars/jackburton_rig/$f" \
              || { echo "rigged Jack is missing $f"; exit 1; }
          done
          # A palette-swapped Kung Fu Man is ~200 KB; the rig's baked sprite set is
          # megabytes. A small file here means the rig was never baked in.
          rig_bytes=$(wc -c < "$out/chars/jackburton_rig/jackburton.sff")
          test "$rig_bytes" -gt 1000000 \
            || { echo "chars/jackburton_rig/jackburton.sff is only $rig_bytes bytes - that is a placeholder, not the rig"; exit 1; }
          echo "rigged Jack: $rig_bytes bytes of sprites"
          for id in jackburton wangchi gracielaw eggshen rain lightning thunder lopan; do
            test -f "$out/chars/$id/$id.sff" || { echo "missing fighter $id"; exit 1; }
            test -f "$out/chars/$id/$id.cns" || { echo "missing $id.cns"; exit 1; }
          done
          for s in $ours; do
            test -f "$out/stages/$s.def" || { echo "missing stage $s"; exit 1; }
            test -f "$out/stages/$s.sff" || { echo "missing stage art $s"; exit 1; }
          done
          # Geometry guard: the backdrop has to reach at least one screen past
          # each camera limit, or players walk into an unpainted edge. A stale
          # stages/ folder is exactly what this catches.
          for s in $ours; do
            scroll=$(grep -oE '^boundleft[[:space:]]*=[[:space:]]*-?[0-9]+' "$out/stages/$s.def" | grep -oE '[0-9]+$')
            # The widest backdrop layer, not the first one: a stage legitimately
            # draws narrow overlays at a smaller start (the fog film in the gate,
            # the sky band), so reading the first start line measured an overlay
            # and failed stages whose backdrop does cover the pan.
            startx=$(grep -oE '^start[[:space:]]*=[[:space:]]*-[0-9]+' "$out/stages/$s.def" | grep -oE '[0-9]+$' | sort -n | tail -1)
            test -n "$scroll" && test -n "$startx" || { echo "$s: no [Camera] boundleft or layer start"; exit 1; }
            art=$startx
            need=$(( scroll + 160 ))
            if [ "$art" -lt "$need" ]; then
              echo "$s: art reaches -$art but the camera pans +/-$scroll, so it needs -$need or wider"; exit 1
            fi
            echo "stage $s: art half-width $art, camera +/-$scroll, needs $need"
          done
          test -f "$out/LICENCE.txt" || { echo "engine licence is missing from the bundle"; exit 1; }
          grep -qi 'MIT License' "$out/LICENCE.txt" || { echo "LICENCE.txt is not the engine MIT licence"; exit 1; }
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            test -s "$out/READ-ME-FIRST.txt" \
              || { echo "READ-ME-FIRST.txt is missing from the Windows bundle"; exit 1; }
            want_hash=$(sha256sum "$exe" | cut -d' ' -f1)
            grep -q "$want_hash" "$out/READ-ME-FIRST.txt" \
              || { echo "READ-ME-FIRST.txt does not carry the hash of the engine this bundle ships"; exit 1; }
            test -s "$out/ALLOW-THROUGH-DEFENDER.bat" \
              || { echo "ALLOW-THROUGH-DEFENDER.bat is missing from the Windows bundle"; exit 1; }
            test -s "$out/Update and Play.bat" \
              || { echo "Update and Play.bat is missing from the Windows bundle"; exit 1; }
            echo "antivirus note carries $want_hash"
          fi
          test -f "$out/VERSION.txt" || { echo "VERSION.txt is missing from the bundle"; exit 1; }
          echo "--- build stamp ---"; cat "$out/VERSION.txt"
          # Every BGM this game names must be inside the zip, or that screen or
          # fight plays in silence. Only our own stages are checked: the engine
          # ships stages that reference sound/kfm.mid, which its archive does not
          # contain, and that is not ours to fix. A slot may name a track that is
          # not committed yet (a player can drop their own in), so a miss warns.
          refs=$( { grep -hE '^[[:space:]]*[a-z]+\.bgm[[:space:]]*=' "$out/data/ikemen1/system.def" 2>/dev/null || true
                    for s in $ours; do
                      grep -hE '^[[:space:]]*bgmusic[[:space:]]*=' "$out/stages/$s.def" 2>/dev/null || true
                    done
                  } | sed -E 's/^[^=]*=[[:space:]]*//; s/;.*$//; s/[[:space:]]+$//' \
                  | grep -v '^$' | sort -u || true )
          echo "referenced bgm: ${refs:-(none)}"
          for ref in $refs; do
            if [ -f "$out/$ref" ]; then
              echo "bgm ok: $ref ($(du -h "$out/$ref" | cut -f1))"
            else
              echo "::warning::bgm named but not in the bundle: $ref - that screen stays silent until a track with that name is added to sound/"
            fi
          done
          du -sh "$out"

      - name: Pack the zip
        run: |
          set -euo pipefail
          mkdir -p dist
          cd out
          zip -qr "../dist/${{ matrix.folder }}.zip" "${{ matrix.folder }}"
          cd ..
          ( cd dist && sha256sum "${{ matrix.folder }}.zip" > "${{ matrix.folder }}.zip.sha256" )
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List bundled zips
        run: ls -lh dist

      - name: Collect the checksums
        run: |
          set -euo pipefail
          cat dist/*.zip.sha256 > SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "no checksums were produced"; exit 1; }
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Big Trouble in Little China ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            **Before you run it: Windows Defender may call the game a trojan. It is not one.**
            The engine is unsigned - no paid code-signing certificate - so Defender's cloud
            checker labels a fresh copy `Trojan:Win32/Tecabans.A!cl`, and the `!cl` suffix means
            a cloud verdict rather than a virus signature. The engine's own maintainers answered
            this exact report as a false alarm
            ([ikemen-engine/Ikemen-GO issue 2811](https://github.com/ikemen-engine/Ikemen-GO/issues/2811)),
            and it returns every time a new engine build appears. Inside the Windows zip:
            `READ-ME-FIRST.txt` carries the SHA-256 of the game file in that zip,
            `ALLOW-THROUGH-DEFENDER.bat` clears the warning in one double-click, and
            `SHA256SUMS.txt` on this page checks the download itself. If Defender already
            removed the file, restore it from Protection history first.

            Ready-to-run builds. Download the zip for your platform, unzip it, and launch —
            the Ikemen GO engine is already inside, so there is nothing else to install.
            `VERSION.txt` in the game folder names the build you are running.

            Questions, bug reports or a fight to pick? Join the Discord: https://discord.gg/Bn2kABJsK5

            | Platform | Launch |
            |---|---|
            | Windows | double-click `BigTroubleInLittleChinaTheGame.exe` |
            | Linux | `chmod +x BigTroubleInLittleChinaTheGame && ./BigTroubleInLittleChinaTheGame` |
            | macOS | right-click the app → **Open** the first time (the build is unsigned) |

            **Controls:** arrows to move, `Z`/`X`/`C` to attack, `A` light punch, `S` medium,
            `D` heavy, `Enter` to start, `Esc` to pause. Full move list per fighter is on the
            in-game pause menu.

            Roster: Jack Burton, Wang Chi, Gracie Law, Egg Shen, Rain, Lightning, Thunder, Lo Pan,
            plus twelve Wing Kong and Chang Sing gang fighters.
            Stages: Lo Pan's Throne, Wing Kong Exchange, Chinatown Back Alley, Pork Chop Express,
            The Sewer, The Buddha Garden, Inside Dragon of the Black Pool Restaurant,
            Airport Terminal.

            Jack Burton and Lightning are drawn and animated by the project's own puppet rigs
            (`chars/jackburton_rig`, `chars/lightning_rig`); the other fighters use recoloured
            Kung Fu Man sprites (see `docs/DESIGN.md`). The stages are original to this project. Fan project, not affiliated with the film's rights
            holders. The Ikemen GO engine is MIT licensed and redistributed unmodified — its
            `LICENCE.txt` is inside each zip.
          files: |
            dist/*.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
