name: apply-side-bake
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the profile-bake patch
        run: |
          git config user.name "bigtrouble-bot"
          git config user.email "actions@users.noreply.github.com"
          git apply -v .github/side-bake.patch
          git add -A
          git commit -m "Draw fight poses from the profile part set"
          git push origin HEAD:main
