# One-shot: applies the glyph offset fix to tools/, then leaves main clean.
# The unpack is plain shell - a python heredoc inside run: | failed instantly.

name: glyph offset fix (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the patch
        run: |
          set -euo pipefail
          base64 -d _menu5.b64 | gunzip > /tmp/menu5.patch
          wc -c /tmp/menu5.patch

      - name: Apply it
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn --verbose /tmp/menu5.patch
          grep -n "Offset = 0,{cell_h - 1}" tools/build_fonts.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q _menu5.b64
          git add -A
          git commit -m "Place bitmap glyphs where the TrueType text drew them"
          git pull --rebase --autostash origin main
          git push
