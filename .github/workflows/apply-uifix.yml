name: apply-uifix

# One-shot: applies tools/_uifix.diff to main and pushes, then deletes itself
# from the tree in a follow-up commit (a run can be cancelled if the workflow
# file it is running from disappears mid-run).
on: workflow_dispatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch
        run: |
          if ! git apply --ignore-whitespace --verbose tools/_uifix.diff; then
            echo "git apply failed, falling back to patch(1)"
            patch -p1 --batch --no-backup-if-mismatch < tools/_uifix.diff
          fi
          echo "--- changed files ---"
          git diff --stat
          grep -n "TITLE_LAYOUT" tools/build_select_ui.py
          grep -n "arm_n=(-30" tools/char_rig.py
      - name: Commit and push
        run: |
          rm -f tools/_uifix.diff
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fit the title menu on screen and hang Jack's arms at idle"
          git push
