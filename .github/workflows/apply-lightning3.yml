name: Apply the additive AIR blend flags

# One-shot: applies tools/_lightning3.patch, regenerates Lightning, runs the
# validator, pushes, then deletes itself and its payload.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, rebuild, push
        run: |
          set -euo pipefail
          git apply --check tools/_lightning3.patch
          git apply tools/_lightning3.patch
          python3 -m pip install --quiet pillow
          python3 tools/build_chars.py
          python3 tools/bake_char.py lightning
          python3 tools/build_portraits.py
          python3 tools/validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lightning.py chars/lightning_rig
          git commit -q -m "Flag Lightning's bolt and discharges additive in the AIR"
          git push origin HEAD:main
          git rm -q .github/workflows/apply-lightning3.yml tools/_lightning3.patch
          git commit -q -m "Remove the one-shot AIR blend workflow"
          git push origin HEAD:main
          echo "landed at $(git rev-parse HEAD)"
