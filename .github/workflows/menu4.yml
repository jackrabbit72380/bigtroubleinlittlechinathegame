# One-shot: applies the 3D glyph-font patch (tools only), then leaves main
# clean. No workflow file is touched - a GITHUB_TOKEN push cannot edit
# .github/workflows/*, and its push does not trigger build-assets.yml.

name: 3D menu glyphs (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the patch
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          raw = pathlib.Path("_menu4.b64").read_bytes().strip()
          blob = raw if raw[:2] == b"\x1f\x8b" else base64.b64decode(raw)
          patch = gzip.decompress(blob)
          pathlib.Path("/tmp/menu4.patch").write_bytes(patch)
          print(len(patch), "bytes of patch")
          PY

      - name: Apply it
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn --verbose /tmp/menu4.patch
          grep -q "def glyph" tools/build_fonts.py
          grep -q "Type = bitmap" tools/build_fonts.py
          grep -q "gold face on maroon extrusion" tools/validate.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q _menu4.b64
          git add -A
          git commit -m "Bake the wordmark look into the menu glyphs"
          git pull --rebase --autostash origin main
          git push
