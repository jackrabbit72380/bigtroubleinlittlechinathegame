# One-shot repair, see tools/_oneshot_fix.py for the two defects it fixes:
# the rig fighters had no localcoord (drawn 3x too big) and palette grading
# turned skin magenta. Runs the repair, rebuilds every asset, then removes itself.

name: Fix fighter scale and palettes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python3 -m pip install --quiet pillow

      - name: Apply the repair
        run: python3 tools/_oneshot_fix.py

      - name: Rebuild every asset
        run: python3 tools/build_all.py

      - name: Commit, then remove the one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-scale.yml tools/_oneshot_fix.py
          git add -A
          git commit -m "Give the rig fighters their real localcoord and stop grading skin tones"
          git push
