# Build game assets
#
# The repo tracks sources and generators, not binaries: this workflow fetches
# the Ikemen GO release for its screenpack, fonts and the Kung Fu Man base
# character, then runs tools/build_all.py so chars/, stages/, data/ and
# artifacts/ exist in the repo without anything being hand-uploaded.

name: Build game assets

on:
  push:
    branches: [main]
    paths-ignore:
      - "chars/**"
      - "stages/**"
      - "data/**"
      - "font/**"
      - "external/**"
      - "artifacts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python3 -m pip install --quiet pillow

      - name: Fetch Ikemen GO build
        run: |
          curl -sSL -o /tmp/ikemen.zip \
            https://github.com/ikemen-engine/Ikemen-GO/releases/download/nightly/Ikemen_GO-dev-linux.zip
          mkdir -p /tmp/ikemen
          unzip -q /tmp/ikemen.zip -d /tmp/ikemen
          ROOT=$(dirname "$(find /tmp/ikemen -maxdepth 2 -type d -name data | head -1)")
          test -d "$ROOT" || { echo "engine data not found in release"; exit 1; }
          echo "IKEMEN_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Stage engine data and base character
        run: |
          cp -rT "$IKEMEN_ROOT/data" data
          cp -rT "$IKEMEN_ROOT/font" font
          cp -rT "$IKEMEN_ROOT/external" external
          mkdir -p chars stages
          cp -r "$IKEMEN_ROOT/chars/kfm" chars/
          cp "$IKEMEN_ROOT"/stages/stage0.* stages/ || true
          git checkout -- data/select.def
          sed -i 's/^name = IKEMEN1.*/name = Big Trouble in Little China   ;Name of motif/' \
            data/ikemen1/system.def data/fight.def

      - name: Build roster and stages
        run: python3 tools/build_all.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "assets already up to date"
            exit 0
          fi
          git commit -m "Regenerate game assets from tools/"
          git push
