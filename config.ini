; Big Trouble in Little China: The Game
; Shipped defaults. The engine copies these into save/config.ini on exit, so a
; setting changed in the Video menu persists there and this file is only what a
; fresh install starts from.
;
; RenderMode accepts three values: "OpenGL 3.3", "OpenGL ES 3.2" and
; "Vulkan 1.3". OpenGL 3.3 is the default because the Vulkan renderer in the
; current engine nightly aborts at startup on some drivers with
;
;   vk.QueueSubmit failed with vulkan error: device lost
;
; and it does so before the menus exist, so there is no way back to OpenGL from
; inside the game. Choose Vulkan 1.3 in Video Settings if your hardware runs it;
; anything the engine does not recognise falls back to OpenGL 3.3 on its own.
;
; EnableModel must stay 1 for Vulkan: the engine crashes on that renderer when
; 3D Model support is off.
[Video]
GameWidth = 1920
GameHeight = 1080
WindowWidth = 1920
WindowHeight = 1080
KeepAspect = true
Fullscreen = false
RenderMode = OpenGL 3.3

[Config]
WindowTitle = Big Trouble in Little China: The Game
